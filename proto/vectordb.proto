syntax = "proto3";

package vectordb.v1;

service VectorDB {
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc InsertBatch(BatchInsertRequest) returns (BatchInsertResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetStats(StatsRequest) returns (StatsResponse);
  rpc CreateSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

message VectorRecord {
  uint64 id = 1;
  repeated float values = 2;
  map<string, string> metadata = 3;
}

message InsertRequest {
  VectorRecord record = 1;
}

message InsertResponse {
  bool success = 1;
  string message = 2;
}

message BatchInsertRequest {
  repeated VectorRecord records = 1;
}

message BatchInsertResponse {
  uint64 inserted_count = 1;
}

message SearchRequest {
  repeated float query = 1;
  uint32 k = 2;
  map<string, string> metadata_filter = 3;
}

message SearchResult {
  uint64 id = 1;
  float distance = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message StatsRequest {}

message StatsResponse {
  uint64 vector_count = 1;
  uint64 dimension = 2;
  string metric = 3;
}

message SnapshotRequest {}

message SnapshotResponse {
  bool success = 1;
  string message = 2;
}
