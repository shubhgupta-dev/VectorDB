[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectordb-sdk"
version = "0.1.0"
description = "Python SDK for a lightweight C++ HNSW vector database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.85.0",
    "protobuf>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
